user nginx;
worker_processes 4 ;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log off;

    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Larger buffers for proxy responses
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Response cache for /api/* — short TTL (1s) so the cache absorbs most of
    # the read load without serving stale stock data longer than ~1s.
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60s use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
