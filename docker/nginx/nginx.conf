upstream nest_backend {
    least_conn;
    server nest-1:3000 max_fails=3 fail_timeout=10s;
    server nest-2:3000 max_fails=3 fail_timeout=10s;
    server nest-3:3000 max_fails=3 fail_timeout=10s;
    server nest-4:3000 max_fails=3 fail_timeout=10s;
    server nest-5:3000 max_fails=3 fail_timeout=10s;
    server nest-6:3000 max_fails=3 fail_timeout=10s;
    keepalive 512;
    keepalive_requests 100000;
    keepalive_timeout 60s;
}

server {
    listen 80 backlog=65535 default_server;
    server_name _;
    keepalive_requests 100000;
    keepalive_timeout 65s;

    # Health endpoint — round-robin across all instances
    location ~ ^/health(/.*)?$ {
        proxy_pass http://nest_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_socket_keepalive on;
    }

    # API routes — load balanced
    location /api/ {
        proxy_pass http://nest_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_socket_keepalive on;
        proxy_buffering off;
    }
}
